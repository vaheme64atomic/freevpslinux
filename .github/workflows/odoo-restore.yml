name: Odoo Restore

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  restore:
    runs-on: self-hosted

    steps:

      # =========================================================
      # 1. Find latest successful backup
      # =========================================================
      - name: Find latest backup run
        id: find_backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "Finding latest successful Odoo backup..."

          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "odoo-backup.yml" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful backup run found."
            exit 1
          fi

          echo "Latest backup Run ID: $RUN_ID"

          echo "RUN_ID=$RUN_ID" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 2. Download backup
      # =========================================================
      - name: Download latest backup
        id: download_backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.find_backup.outputs.RUN_ID }}
        run: |
          set -e

          RESTORE_DIR="/tmp/odoo-restore-${RUN_ID}"

          sudo rm -rf "$RESTORE_DIR"
          sudo mkdir -p "$RESTORE_DIR"
          sudo chown runner:runner "$RESTORE_DIR"

          echo "Restore directory:"
          echo "$RESTORE_DIR"

          gh run download "$RUN_ID" \
            --repo "$REPO" \
            --name odoo-backup \
            --dir "$RESTORE_DIR"

          echo ""
          echo "Downloaded backup:"
          ls -lh "$RESTORE_DIR"

          echo "RESTORE_DIR=$RESTORE_DIR" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 3. Verify backup
      # =========================================================
      - name: Verify backup
        env:
          RESTORE_DIR: ${{ steps.download_backup.outputs.RESTORE_DIR }}
        run: |
          set -e

          BACKUP=$(find "$RESTORE_DIR" \
            -type f \
            -name 'kosarTest_backup_*.tar.gz' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)

          if [ -z "$BACKUP" ]; then
            echo "ERROR: Backup archive not found."
            exit 1
          fi

          echo "Selected backup:"
          ls -lh "$BACKUP"

          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"


      # =========================================================
      # 4. Extract backup
      # =========================================================
      - name: Extract backup
        run: |
          set -e

          WORK_DIR="/tmp/odoo_restore_work"

          sudo rm -rf "$WORK_DIR"
          sudo mkdir -p "$WORK_DIR"

          echo "Extracting backup:"
          echo "$BACKUP"

          sudo tar -xzf "$BACKUP" \
            -C "$WORK_DIR"

          echo ""
          echo "=== Backup structure ==="

          sudo find "$WORK_DIR" \
            -maxdepth 8 \
            -printf '%y %p\n' \
            | sort

          echo ""
          echo "=== Backup sizes ==="

          sudo du -ah "$WORK_DIR" \
            | sort -h \
            | tail -30


      # =========================================================
      # 5. Validate backup contents
      # =========================================================
      - name: Validate backup contents
        run: |
          set -e

          WORK_DIR="/tmp/odoo_restore_work"

          DUMP="$WORK_DIR/kosarTest.dump"
          FILESTORE="$WORK_DIR/kosarTest-filestore.tar.gz"
          ODOO_CONF="$WORK_DIR/odoo.conf"

          echo "Checking database dump..."

          if [ ! -f "$DUMP" ]; then
            echo "ERROR: Database dump not found."
            exit 1
          fi

          echo "Checking filestore backup..."

          if [ ! -f "$FILESTORE" ]; then
            echo "ERROR: Filestore backup not found."
            exit 1
          fi

          echo "Checking Odoo configuration..."

          if [ ! -f "$ODOO_CONF" ]; then
            echo "WARNING: odoo.conf not found."
          fi

          echo ""
          echo "Database dump:"
          ls -lh "$DUMP"

          echo ""
          echo "Filestore:"
          ls -lh "$FILESTORE"

          echo ""
          echo "Backup contents validated."


      # =========================================================
      # 6. Restore test database
      # =========================================================
      - name: Restore test database
        run: |
          set -e

          DB_NAME="kosarRestoreTest"
          DUMP="/tmp/odoo_restore_work/kosarTest.dump"

          echo "=== Preparing PostgreSQL ==="

          echo "Stopping Odoo..."

          sudo systemctl stop odoo || true

          echo "Checking PostgreSQL..."

          sudo systemctl is-active postgresql

          echo ""
          echo "Checking PostgreSQL role..."

          sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin';"

          if ! sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin';" | grep -q 1
          then
            echo "ERROR: PostgreSQL role odooadmin does not exist."
            exit 1
          fi

          echo ""
          echo "Terminating existing connections..."

          sudo -u postgres psql -c \
            "SELECT pg_terminate_backend(pid)
             FROM pg_stat_activity
             WHERE datname='$DB_NAME'
             AND pid <> pg_backend_pid();"

          echo ""
          echo "Dropping old test database..."

          sudo -u postgres dropdb \
            --if-exists \
            "$DB_NAME"

          echo ""
          echo "Creating test database..."

          sudo -u postgres createdb \
            -O odooadmin \
            "$DB_NAME"

          echo ""
          echo "Restoring database..."

          sudo -u postgres pg_restore \
            --dbname="$DB_NAME" \
            --no-owner \
            --no-acl \
            "$DUMP"

          echo ""
          echo "=== Database restore completed ==="


      # =========================================================
      # 7. Validate restored database
      # =========================================================
      - name: Validate restored database
        run: |
          set -e

          DB_NAME="kosarRestoreTest"

          echo "Checking database..."

          sudo -u postgres psql \
            -d "$DB_NAME" \
            -c "SELECT current_database();"

          echo ""
          echo "Checking users..."

          sudo -u postgres psql \
            -d "$DB_NAME" \
            -c "SELECT count(*) AS users FROM res_users;"

          echo ""
          echo "Checking attachments..."

          sudo -u postgres psql \
            -d "$DB_NAME" \
            -c "SELECT count(*) AS attachments FROM ir_attachment;"

          echo ""
          echo "Checking tables..."

          sudo -u postgres psql \
            -d "$DB_NAME" \
            -c "
              SELECT count(*) AS table_count
              FROM information_schema.tables
              WHERE table_schema='public';
            "

          echo ""
          echo "Database validation completed."


      # =========================================================
      # 8. Restore filestore
      # =========================================================
      - name: Restore filestore
        run: |
          set -e

          DB_NAME="kosarRestoreTest"
          FILESTORE="/tmp/odoo_restore_work/kosarTest-filestore.tar.gz"

          ODOO_DATA_DIR=$(sudo -u postgres psql \
            -d "$DB_NAME" \
            -tAc "
              SELECT value
              FROM ir_config_parameter
              WHERE key='data_dir'
              LIMIT 1;
            " | xargs || true)

          echo "Database data_dir:"
          echo "$ODOO_DATA_DIR"

          if [ -z "$ODOO_DATA_DIR" ]; then
            echo "WARNING: data_dir not found in database."
            echo "Filestore restore will be skipped."
            exit 0
          fi

          FILESTORE_DIR="$ODOO_DATA_DIR/filestore/$DB_NAME"

          echo ""
          echo "Filestore destination:"
          echo "$FILESTORE_DIR"

          sudo rm -rf "$FILESTORE_DIR"

          sudo mkdir -p "$FILESTORE_DIR"

          sudo tar -xzf "$FILESTORE" \
            -C "$ODOO_DATA_DIR/filestore"

          echo ""
          echo "=== Filestore restored ==="

          sudo find "$ODOO_DATA_DIR/filestore" \
            -maxdepth 2 \
            -type d \
            | head -20


      # =========================================================
      # 9. Show environment
      # =========================================================
      - name: Show restore environment
        run: |
          echo "======================================"
          echo "Restore Environment"
          echo "======================================"

          echo ""
          echo "Runner:"
          hostname

          echo ""
          echo "User:"
          whoami

          echo ""
          echo "PostgreSQL:"
          systemctl is-active postgresql || true

          echo ""
          echo "Odoo:"
          systemctl is-active odoo || true

          echo ""
          echo "Test database:"
          sudo -u postgres psql -tAc \
            "SELECT datname FROM pg_database WHERE datname='kosarRestoreTest';"


      # =========================================================
      # 10. Start Odoo
      # =========================================================
      - name: Start Odoo
        run: |
          set -e

          echo "Starting Odoo..."

          sudo systemctl start odoo

          echo "Waiting for Odoo..."

          sleep 5

          echo ""
          echo "Odoo service status:"

          sudo systemctl is-active odoo

          echo ""
          echo "Odoo service details:"

          sudo systemctl --no-pager --full status odoo | head -40


      # =========================================================
      # 11. Final health check
      # =========================================================
      - name: Odoo health check
        run: |
          set -e

          echo "Checking Odoo process..."

          if ! sudo systemctl is-active --quiet odoo; then
            echo "ERROR: Odoo service is not active."
            sudo journalctl -u odoo \
              --no-pager \
              -n 100
            exit 1
          fi

          echo ""
          echo "Checking Odoo port..."

          if sudo ss -lntp | grep -q ':8069'; then
            echo "Odoo is listening on port 8069."
          else
            echo "WARNING: Odoo is not listening on port 8069."
          fi

          echo ""
          echo "======================================"
          echo "ODOO RESTORE TEST SUCCESSFUL"
          echo "======================================"
