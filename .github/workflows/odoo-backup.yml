
name: Odoo Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: self-hosted

    steps:
      - name: Run Odoo backup
        run: |
          sudo -n /opt/odoo/backup_odoo.sh

      - name: Find latest backup
        id: backup
        run: |
          BACKUP=$(sudo ls -t /var/backups/odoo/kosarTest_backup_*.tar.gz | head -1)
          echo "BACKUP=$BACKUP" >> "$GITHUB_OUTPUT"
          echo "Latest backup: $BACKUP"

      - name: Copy backup to runner workspace
        run: |
          sudo cp "${{ steps.backup.outputs.BACKUP }}" \
            "$GITHUB_WORKSPACE/"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-backup
          path: "${{ github.workspace }}/kosarTest_backup_*.tar.gz"
          retention-days: 7
