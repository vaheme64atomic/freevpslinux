
name: Odoo Backup

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: self-hosted

    steps:
      - name: Run Odoo backup
        run: |
          sudo -n /opt/odoo/backup_odoo.sh

      - name: Find latest backup
        run: |
          BACKUP=$(sudo find /var/backups/odoo \
            -maxdepth 1 \
            -type f \
            -name 'kosarTest_backup_*.tar.gz' \
            -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)

          echo "Latest backup: $BACKUP"

          sudo cp "$BACKUP" "$GITHUB_WORKSPACE/"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-backup
          path: "${{ github.workspace }}/kosarTest_backup_*.tar.gz"
          retention-days: 7
