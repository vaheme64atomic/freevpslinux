name: Linux Odoo Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # --------------------------------------------------
      # 1. Update system
      # --------------------------------------------------
      - name: 1. Update Ubuntu
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      # --------------------------------------------------
      # 2. Install XFCE + XRDP
      # --------------------------------------------------
      - name: 2. Install XFCE and XRDP
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      # --------------------------------------------------
      # 3. Create dedicated RDP user
      # --------------------------------------------------
      - name: 3. Create Odoo Admin User
        run: |
          sudo useradd -m -s /bin/bash odooadmin || true

          echo 'odooadmin:OdooLab@2026!' | sudo chpasswd

          sudo usermod -aG sudo odooadmin
          sudo usermod -aG ssl-cert xrdp

          sudo mkdir -p /home/odooadmin
          sudo chown -R odooadmin:odooadmin /home/odooadmin

      # --------------------------------------------------
      # 4. Configure XFCE for XRDP
      # --------------------------------------------------
      - name: 4. Configure XFCE
        run: |
          sudo -u odooadmin bash -c 'cat > /home/odooadmin/.xsession <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF'

          sudo chmod +x /home/odooadmin/.xsession
          sudo chown odooadmin:odooadmin /home/odooadmin/.xsession

      # --------------------------------------------------
      # 5. Configure XRDP
      # --------------------------------------------------
      - name: 5. Configure XRDP
        run: |
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_CONFIG_HOME
          unset XDG_CACHE_HOME
          unset XDG_DATA_HOME

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      # --------------------------------------------------
      # 6. Enable XRDP
      # --------------------------------------------------
      - name: 6. Start XRDP
        run: |
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl status xrdp --no-pager

      # --------------------------------------------------
      # 7. Install PostgreSQL
      # --------------------------------------------------
      - name: 7. Install PostgreSQL
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            postgresql \
            postgresql-contrib

          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          echo "PostgreSQL status:"
          sudo systemctl is-active postgresql

          echo "PostgreSQL version:"
          sudo -u postgres psql --version

      # --------------------------------------------------
      # 8. Create PostgreSQL role for Odoo
      # --------------------------------------------------
      - name: 8. Configure PostgreSQL for Odoo
        run: |
          echo "Checking PostgreSQL roles..."

          if sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin'" | grep -q 1
          then
            echo "Role odooadmin already exists."
          else
            echo "Creating role odooadmin..."

            sudo -u postgres psql -c \
              "CREATE ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"
          fi

          echo ""
          echo "PostgreSQL roles:"
          sudo -u postgres psql -c "\du"

      # --------------------------------------------------
      # 9. Install Odoo 19 dependencies
      # --------------------------------------------------
      - name: 9. Install Odoo 19 dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            python3-dev \
            python3-venv \
            python3-pip \
            build-essential \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            libsasl2-dev \
            libldap2-dev \
            libssl-dev \
            libjpeg-dev \
            libpq-dev \
            libffi-dev \
            libjpeg8-dev \
            liblcms2-dev \
            libblas-dev \
            libatlas-base-dev \
            npm \
            node-less \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev \
            wkhtmltopdf

      # --------------------------------------------------
      # 10. Create Odoo user and directories
      # --------------------------------------------------
      - name: 10. Create Odoo environment
        run: |
          if id odoo >/dev/null 2>&1; then
            echo "Odoo user already exists."
          else
            sudo useradd \
              --system \
              --home-dir /opt/odoo \
              --create-home \
              --shell /bin/bash \
              odoo
          fi

          sudo mkdir -p /opt/odoo
          sudo mkdir -p /opt/odoo/custom-addons
          sudo mkdir -p /opt/odoo/.local/share/Odoo/filestore

          sudo chown -R odoo:odoo /opt/odoo

      # --------------------------------------------------
      # 11. Download Odoo 19
      # --------------------------------------------------
      - name: 11. Install Odoo 19
        run: |
          sudo -u odoo git clone \
            --depth 1 \
            --branch 19.0 \
            https://github.com/odoo/odoo.git \
            /opt/odoo/odoo

          echo "Odoo source:"
          sudo -u odoo git -C /opt/odoo/odoo rev-parse --short HEAD

      # --------------------------------------------------
      # 12. Create Python virtual environment
      # --------------------------------------------------
      - name: 12. Create Odoo Python environment
        run: |
          sudo -u odoo python3 -m venv /opt/odoo/venv

          sudo -u odoo /opt/odoo/venv/bin/pip install \
            --upgrade pip setuptools wheel

          sudo -u odoo /opt/odoo/venv/bin/pip install \
            -r /opt/odoo/odoo/requirements.txt

      # --------------------------------------------------
      # 13. Configure Odoo 19
      # --------------------------------------------------
      - name: 13. Configure Odoo
        run: |
          sudo tee /etc/odoo.conf > /dev/null <<'EOF'
          [options]

          admin_passwd = vahid123

          db_host = 127.0.0.1
          db_port = 5432
          db_user = odooadmin
          db_password = odooadmin

          addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons

          data_dir = /opt/odoo/.local/share/Odoo

          logfile = /var/log/odoo/odoo.log
          log_level = info

          http_port = 8069
          proxy_mode = False
          list_db = True
          EOF

          sudo mkdir -p /var/log/odoo
          sudo touch /var/log/odoo/odoo.log
          sudo chown -R odoo:odoo /var/log/odoo

          sudo chown root:odoo /etc/odoo.conf
          sudo chmod 640 /etc/odoo.conf

      # --------------------------------------------------
      # 14. Create Odoo systemd service
      # --------------------------------------------------
      - name: 14. Create Odoo service
        run: |
          sudo tee /etc/systemd/system/odoo.service > /dev/null <<'EOF'
          [Unit]
          Description=Odoo 19
          Documentation=https://www.odoo.com
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple
          User=odoo
          Group=odoo

          ExecStart=/opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin -c /etc/odoo.conf

          Restart=on-failure
          RestartSec=5

          KillMode=mixed
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable odoo

      # --------------------------------------------------
      # 15. Start Odoo
      # --------------------------------------------------
      - name: 15. Start Odoo
        run: |
          sudo systemctl start odoo

          sleep 10

          echo "Odoo service:"
          sudo systemctl is-active odoo

          echo ""
          echo "Odoo port:"
          sudo ss -lntp | grep 8069 || true

          echo ""
          echo "Odoo HTTP test:"
          curl -I http://127.0.0.1:8069 || true

      # --------------------------------------------------
      # 16. Verify Odoo configuration
      # --------------------------------------------------
      - name: 16. Verify Odoo 19
        run: |
          echo "=========================================="
          echo "Odoo version:"
          echo "=========================================="

          sudo -u odoo /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "=========================================="
          echo "Database configuration:"
          echo "=========================================="

          sudo grep -E \
            '^(db_host|db_port|db_user|addons_path|data_dir|http_port)' \
            /etc/odoo.conf

          echo ""
          echo "=========================================="
          echo "Filestore:"
          echo "=========================================="

          sudo ls -lah /opt/odoo/.local/share/Odoo
          sudo ls -lah /opt/odoo/.local/share/Odoo/filestore

      # --------------------------------------------------
      # 17. Install Tailscale
      # --------------------------------------------------
      - name: 17. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-odoo"

          sleep 5

      # --------------------------------------------------
      # 18. Connection Information
      # --------------------------------------------------
      - name: 18. Connection Information
        run: |
          echo ""
          echo "======================================================"
          echo "        LINUX ODOO 19 LAB IS READY"
          echo "======================================================"

          echo ""
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

          echo ""
          echo "RDP USER:"
          echo "odooadmin"

          echo ""
          echo "RDP PASSWORD:"
          echo "OdooLab@2026!"

          echo ""
          echo "RDP PORT:"
          echo "3389"

          echo ""
          echo "ODOO:"
          echo "http://TAILSCALE-IP:8069"

          echo ""
          echo "ODOO VERSION:"
          sudo -u odoo /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "XRDP STATUS:"
          sudo systemctl is-active xrdp

          echo ""
          echo "ODOO STATUS:"
          sudo systemctl is-active odoo

          echo ""
          echo "POSTGRESQL STATUS:"
          sudo systemctl is-active postgresql

          echo ""
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo ""
          echo "======================================================"

      # --------------------------------------------------
      # 19. Keep Runner Alive
      # --------------------------------------------------
      - name: 19. Keep Server Alive
        run: |
          for i in {1..360}; do
            echo "[$i/360] Linux Odoo 19 Lab is running..."
            sleep 60
          done
