
name: Ubuntu Odoo Lab Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. Update Ubuntu
      # =========================================================
      - name: 1. Update System
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      # =========================================================
      # 2. Create Admin User
      # =========================================================
      - name: 2. Create Admin User
        run: |
          sudo useradd -m -s /bin/bash odooadmin || true

          echo 'odooadmin:OdooLab@2026!' | sudo chpasswd

          sudo usermod -aG sudo odooadmin

          echo "odooadmin ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee /etc/sudoers.d/odooadmin

          sudo chmod 440 /etc/sudoers.d/odooadmin

      # =========================================================
      # 3. Install OpenSSH Server
      # =========================================================
      - name: 3. Install SSH Server
        run: |
          sudo apt-get install -y openssh-server

          sudo systemctl enable ssh
          sudo systemctl restart ssh

          sudo systemctl status ssh --no-pager

      # =========================================================
      # 4. Install Tailscale
      # =========================================================
      - name: 4. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="github-odoo-lab"

          sleep 5

      # =========================================================
      # 5. Get Tailscale IP
      # =========================================================
      - name: 5. Show Server Information
        run: |
          TS_IP=$(sudo tailscale ip -4)

          echo ""
          echo "=================================================="
          echo "        UBUNTU ODOO LAB SERVER READY"
          echo "=================================================="
          echo ""
          echo "Tailscale IP : $TS_IP"
          echo "SSH User     : odooadmin"
          echo ""
          echo "Connect using:"
          echo ""
          echo "ssh odooadmin@$TS_IP"
          echo ""
          echo "=================================================="

      # =========================================================
      # 6. Keep Server Alive
      # =========================================================
      - name: 6. Keep Server Alive
        run: |
          for i in $(seq 1 345); do
            echo "[$i/345] Ubuntu server is running..."
            sleep 60
          done
