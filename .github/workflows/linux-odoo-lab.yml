name: Linux Odoo Lab

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. Update Ubuntu
      # =========================================================
      - name: 1. Update Ubuntu
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      # =========================================================
      # 2. Install XFCE + XRDP
      # =========================================================
      - name: 2. Install XFCE and XRDP
        run: |
          set -e

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      # =========================================================
      # 3. Create RDP admin user
      # =========================================================
      - name: 3. Create Odoo Admin User
        run: |
          set -e

          sudo useradd -m -s /bin/bash odooadmin || true

          echo 'odooadmin:OdooLab@2026!' | sudo chpasswd

          sudo usermod -aG sudo odooadmin

          sudo usermod -aG ssl-cert xrdp

          sudo mkdir -p /home/odooadmin

          sudo chown -R odooadmin:odooadmin /home/odooadmin

      # =========================================================
      # 4. Configure XFCE
      # =========================================================
      - name: 4. Configure XFCE
        run: |
          set -e

          sudo -u odooadmin bash -c 'cat > /home/odooadmin/.xsession <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF'

          sudo chmod +x /home/odooadmin/.xsession
          sudo chown odooadmin:odooadmin /home/odooadmin/.xsession

      # =========================================================
      # 5. Configure XRDP
      # =========================================================
      - name: 5. Configure XRDP
        run: |
          set -e

          sudo cp /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_CONFIG_HOME
          unset XDG_CACHE_HOME
          unset XDG_DATA_HOME

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      # =========================================================
      # 6. Start XRDP
      # =========================================================
      - name: 6. Start XRDP
        run: |
          set -e

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl is-active xrdp

      # =========================================================
      # 7. Install Tailscale
      # =========================================================
      - name: 7. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-odoo"

          sleep 5

          sudo tailscale status

      # =========================================================
      # 8. Install PostgreSQL
      # =========================================================
      - name: 8. Install PostgreSQL
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            postgresql \
            postgresql-client

          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          sleep 3

          sudo systemctl is-active postgresql

          echo ""
          echo "PostgreSQL version:"
          sudo -u postgres psql -c "SELECT version();"

      # =========================================================
      # 9. Create PostgreSQL Odoo role
      # =========================================================
      - name: 9. Create PostgreSQL Odoo role
        run: |
          set -e

          if sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin'" \
            | grep -q 1
          then
            echo "Role odooadmin already exists."

            sudo -u postgres psql -c \
              "ALTER ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"
          else
            echo "Creating role odooadmin..."

            sudo -u postgres psql -c \
              "CREATE ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"
          fi

          echo ""
          echo "PostgreSQL roles:"

          sudo -u postgres psql -c "\du"

      # =========================================================
      # 10. Install Odoo 19 dependencies
      # =========================================================
      - name: 10. Install Odoo 19 dependencies
        run: |
          set -e

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            build-essential \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            libjpeg-dev \
            libpq-dev \
            libffi-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            libtiff-dev \
            libopenjp2-7-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev \
            npm \
            node-less \
            node-clean-css \
            wkhtmltopdf

      # =========================================================
      # 11. Create Odoo user and directories
      # =========================================================
      - name: 11. Create Odoo system user
        run: |
          set -e

          if id odoo >/dev/null 2>&1; then
            echo "Odoo user already exists."
          else
            sudo useradd \
              --system \
              --home=/opt/odoo \
              --shell=/bin/bash \
              odoo
          fi

          sudo mkdir -p /opt/odoo
          sudo mkdir -p /opt/odoo/custom-addons
          sudo mkdir -p /opt/odoo/.local/share/Odoo/filestore

          sudo chown -R odoo:odoo /opt/odoo

      # =========================================================
      # 12. Download Odoo 19
      # =========================================================
      - name: 12. Install Odoo 19
        run: |
          set -e

          if [ -d /opt/odoo/odoo/.git ]; then
            echo "Odoo repository already exists."

            sudo -u odoo git \
              -C /opt/odoo/odoo \
              fetch --depth 1 origin 19.0

            sudo -u odoo git \
              -C /opt/odoo/odoo \
              checkout -B 19.0 origin/19.0
          else
            echo "Cloning Odoo 19..."

            sudo -u odoo git clone \
              --depth 1 \
              --branch 19.0 \
              https://github.com/odoo/odoo.git \
              /opt/odoo/odoo
          fi

          echo ""
          echo "Odoo source branch:"
          sudo -u odoo git \
            -C /opt/odoo/odoo \
            branch --show-current

          echo ""
          echo "Odoo commit:"
          sudo -u odoo git \
            -C /opt/odoo/odoo \
            rev-parse --short HEAD

      # =========================================================
      # 13. Create Python virtual environment
      # =========================================================
      - name: 13. Create Python virtual environment
        run: |
          set -e

          sudo -u odoo python3 -m venv /opt/odoo/venv

          sudo -u odoo \
            /opt/odoo/venv/bin/pip \
            install --upgrade pip setuptools wheel

      # =========================================================
      # 14. Install Python requirements
      # =========================================================
      - name: 14. Install Odoo Python requirements
        run: |
          set -e

          sudo -u odoo \
            /opt/odoo/venv/bin/pip \
            install \
            -r /opt/odoo/odoo/requirements.txt

      # =========================================================
      # 15. Verify Odoo 19 Python environment
      # =========================================================
      - name: 15. Verify Odoo 19
        run: |
          set -e

          echo "Checking lxml..."
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            -c "from lxml import etree; print('lxml OK:', etree.LXML_VERSION)"

          echo ""
          echo "Checking Odoo..."
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

      # =========================================================
      # 15. Configure Odoo
      # =========================================================
      - name: 15. Configure Odoo 19
        run: |
          set -e

          sudo mkdir -p /var/log/odoo
          sudo chown odoo:odoo /var/log/odoo

          sudo tee /etc/odoo.conf > /dev/null <<'EOF'
          [options]

          admin_passwd = vahid123

          db_host = 127.0.0.1
          db_port = 5432
          db_user = odooadmin
          db_password = odooadmin

          addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons

          data_dir = /opt/odoo/.local/share/Odoo

          logfile = /var/log/odoo/odoo.log

          http_port = 8069

          proxy_mode = False
          list_db = True
          EOF

          sudo chown root:odoo /etc/odoo.conf
          sudo chmod 640 /etc/odoo.conf

          echo ""
          echo "Odoo configuration:"
          sudo grep -E \
            '^(admin_passwd|db_host|db_port|db_user|addons_path|data_dir|http_port)' \
            /etc/odoo.conf

      # =========================================================
      # 16. Configure PostgreSQL role
      # =========================================================
      - name: 16. Configure PostgreSQL for Odoo
        run: |
          set -e

          echo "Checking PostgreSQL..."
          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          echo ""
          echo "Creating PostgreSQL role odooadmin..."

          sudo -u postgres psql -tc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin';" \
            | grep -q 1 || \
          sudo -u postgres psql -c \
            "CREATE ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"

          echo ""
          echo "PostgreSQL roles:"
          sudo -u postgres psql -c "\du"


      # =========================================================
      # 16. Create Odoo systemd service
      # =========================================================
      - name: 16. Create Odoo service
        run: |
          set -e

          sudo tee /etc/systemd/system/odoo.service > /dev/null <<'EOF'
          [Unit]
          Description=Odoo 19
          Documentation=https://www.odoo.com
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple

          User=odoo
          Group=odoo

          ExecStart=/opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin -c /etc/odoo.conf

          Restart=on-failure
          RestartSec=5

          KillMode=mixed
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload

          sudo systemctl enable odoo

      # =========================================================
      # 17. Configure Odoo
      # =========================================================
      - name: 17. Configure Odoo
        run: |
          set -e

          sudo mkdir -p /opt/odoo/.local/share/Odoo/filestore
          sudo mkdir -p /var/log/odoo

          sudo chown -R odoo:odoo /opt/odoo/.local
          sudo chown -R odoo:odoo /var/log/odoo

          sudo tee /etc/odoo.conf > /dev/null <<'EOF'
          [options]
          admin_passwd = vahid123
          db_host = False
          db_port = False
          db_user = odooadmin
          db_password = odooadmin
          addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons
          data_dir = /opt/odoo/.local/share/Odoo
          logfile = /var/log/odoo/odoo.log
          http_port = 8069
          proxy_mode = False
          workers = 0
          EOF

          sudo chown odoo:odoo /etc/odoo.conf
          sudo chmod 640 /etc/odoo.conf

      # =========================================================
      # 17. Start Odoo 19
      # =========================================================
      - name: 17. Start Odoo 19
        run: |
          set -e

          sudo systemctl start odoo

          echo "Waiting for Odoo..."

          sleep 10

          echo ""
          echo "Odoo service:"
          sudo systemctl is-active odoo

          echo ""
          echo "Odoo status:"
          sudo systemctl --no-pager --full status odoo | head -50

      # =========================================================
      # 18. Create Odoo 19 systemd service
      # =========================================================
      - name: 18. Create Odoo service
        run: |
          set -e

          sudo tee /etc/systemd/system/odoo.service > /dev/null <<'EOF'
          [Unit]
          Description=Odoo 19
          Requires=postgresql.service
          After=network.target postgresql.service

          [Service]
          Type=simple
          User=odoo
          Group=odoo
          WorkingDirectory=/opt/odoo/odoo
          ExecStart=/opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin -c /etc/odoo.conf
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable odoo
          sudo systemctl start odoo

      # =========================================================
      # 18. Verify Odoo 19
      # =========================================================
      - name: 18. Verify Odoo 19
        run: |
          set -e

          echo "======================================"
          echo "Checking Odoo 19"
          echo "======================================"

          echo ""
          echo "Odoo version:"

          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "PostgreSQL roles:"

          sudo -u postgres psql -c "\du"

          echo ""
          echo "Odoo port:"

          sudo ss -lntp | grep ':8069'

          echo ""
          echo "HTTP test:"

          curl -I \
            --max-time 10 \
            http://127.0.0.1:8069

          echo ""
          echo "======================================"
          echo "ODOO 19 IS READY"
          echo "======================================"

      # =========================================================
      # 19. Verify Odoo service
      # =========================================================
      - name: 19. Verify Odoo service
        run: |
          set -e

          sleep 10

          echo "=== Odoo service ==="
          sudo systemctl is-active odoo

          echo ""
          echo "=== Odoo version ==="
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "=== Odoo port ==="
          sudo ss -lntp | grep ':8069'

          echo ""
          echo "=== HTTP test ==="
          curl -I http://127.0.0.1:8069/web/database/selector

          echo ""
          echo "======================================"
          echo "ODOO 19 LAB READY"
          echo "======================================"

      # =========================================================
      # 19. Show connection information
      # =========================================================
      - name: 19. Connection Information
        run: |
          echo ""
          echo "======================================================"
          echo "             LINUX ODOO 19 LAB READY"
          echo "======================================================"

          echo ""
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

          echo ""
          echo "RDP USER:"
          echo "odooadmin"

          echo ""
          echo "RDP PASSWORD:"
          echo "OdooLab@2026!"

          echo ""
          echo "RDP PORT:"
          echo "3389"

          echo ""
          echo "ODOO:"
          echo "http://<TAILSCALE-IP>:8069"

          echo ""
          echo "ODOO VERSION:"
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "======================================================"

          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status

          echo ""
          echo "POSTGRESQL:"
          sudo systemctl is-active postgresql

          echo ""
          echo "ODOO:"
          sudo systemctl is-active odoo

      # =========================================================
      # 20. Install GitHub Self-hosted Runner
      # =========================================================
      - name: 20. Configure GitHub Self-hosted Runner
        env:
          RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
        run: |
          set -e

          RUNNER_DIR="/opt/actions-runner"

          echo "Creating GitHub Actions runner..."

          sudo mkdir -p "$RUNNER_DIR"
          sudo chown -R odooadmin:odooadmin "$RUNNER_DIR"

          cd "$RUNNER_DIR"

          echo ""
          echo "Downloading latest GitHub Actions runner..."

          RUNNER_VERSION=$(curl -fsSL \
            https://api.github.com/repos/actions/runner/releases/latest \
            | grep '"tag_name":' \
            | cut -d'"' -f4)

          echo "Runner version: $RUNNER_VERSION"

          RUNNER_VERSION_NUMBER="${RUNNER_VERSION#v}"

          sudo -u odooadmin curl -fL \
            -o actions-runner.tar.gz \
            "https://github.com/actions/runner/releases/download/v${RUNNER_VERSION_NUMBER}/actions-runner-linux-x64-${RUNNER_VERSION_NUMBER}.tar.gz"

          sudo -u odooadmin tar xzf actions-runner.tar.gz

          sudo chown -R odooadmin:odooadmin "$RUNNER_DIR"

          echo ""
          echo "Configuring self-hosted runner..."

          sudo -u odooadmin ./config.sh \
            --unattended \
            --url "https://github.com/vaheme64atomic/freevpslinux" \
            --token "$RUNNER_TOKEN" \
            --name "github-linux-odoo" \
            --labels "self-hosted,linux,odoo19" \
            --work "_work"

          echo ""
          echo "Installing runner service..."

          sudo ./svc.sh install odooadmin

          sudo ./svc.sh start

          echo ""
          echo "Runner service status:"

          sudo ./svc.sh status

      # =========================================================
      # 20. Keep Runner Alive
      # =========================================================
      - name: 20. Keep Server Alive
        run: |
          for i in {1..360}; do
            echo "[$i/360] Linux Odoo 19 Lab is running..."
            sleep 60
          done
