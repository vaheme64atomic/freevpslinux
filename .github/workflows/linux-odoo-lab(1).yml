name: Linux Odoo Lab with openvpn

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. Update Ubuntu
      # =========================================================
      - name: 1. Update Ubuntu
        run: |
          set -e

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y

      # =========================================================
      # 2. Install XFCE + XRDP
      # =========================================================
      - name: 2. Install XFCE and XRDP
        run: |
          set -e

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      # =========================================================
      # 3. Create RDP admin user
      # =========================================================
      - name: 3. Create Odoo Admin User
        run: |
          set -e

          sudo useradd -m -s /bin/bash odooadmin || true

          echo 'odooadmin:OdooLab@2026!' | sudo chpasswd

          sudo usermod -aG sudo odooadmin

          echo 'odooadmin ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/odooadmin
          sudo chmod 440 /etc/sudoers.d/odooadmin
          sudo visudo -cf /etc/sudoers.d/odooadmin
          sudo usermod -aG ssl-cert xrdp

          sudo mkdir -p /home/odooadmin

          sudo chown -R odooadmin:odooadmin /home/odooadmin

      # =========================================================
      # 4. Configure XFCE
      # =========================================================
      - name: 4. Configure XFCE
        run: |
          set -e

          sudo -u odooadmin bash -c 'cat > /home/odooadmin/.xsession <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF'

          sudo chmod +x /home/odooadmin/.xsession
          sudo chown odooadmin:odooadmin /home/odooadmin/.xsession

      # =========================================================
      # 5. Configure XRDP
      # =========================================================
      - name: 5. Configure XRDP
        run: |
          set -e

          sudo cp /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_CONFIG_HOME
          unset XDG_CACHE_HOME
          unset XDG_DATA_HOME

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_SESSION_TYPE=x11

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

      # =========================================================
      # 6. Start XRDP
      # =========================================================
      - name: 6. Start XRDP
        run: |
          set -e

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

          sudo systemctl is-active xrdp

      # =========================================================
      # 7. Install Tailscale
      # =========================================================
      - name: 7. Install Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTHKEY" \
            --hostname="github-linux-odoo"

          sleep 5

          sudo tailscale status

      # =========================================================
      # 8. Install OpenVPN
      # =========================================================
      - name: 8. Install OpenVPN and create client config
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y expect wget

          sudo mkdir -p /tmp/openvpn-install
          sudo wget -q \
            https://raw.githubusercontent.com/aminiyt1/openvpn-install/master/openvpn-install.sh \
            -O /tmp/openvpn-install/openvpn-install.sh
          sudo chmod +x /tmp/openvpn-install/openvpn-install.sh

          # The installer consumes stdin very early, so use a PTY via expect
          # instead of piping answers to stdin.
          sudo expect <<'EXPECT'
          set timeout -1
          log_user 1

          spawn /tmp/openvpn-install/openvpn-install.sh

          expect -re {Protocol \[1\]:} { send "1\r" }
          expect -re {Port \[1194\]:} { send "\r" }
          expect -re {DNS server \[1\]:} { send "\r" }
          expect -re {Name \[client\]:} { send "github-vps\r" }
          expect -re {Press any key to continue\.\.\.} { send "x" }
          expect -re {The client configuration is available in:} { }

          expect eof
          EXPECT

          CLIENT_CONFIG=/tmp/openvpn-install/github-vps.ovpn

          test -s "$CLIENT_CONFIG"
          test -s /etc/openvpn/server/server.conf

          echo ""
          echo "======================================"
          echo "OpenVPN client created successfully"
          echo "======================================"
          echo "Client: github-vps"
          echo "Config: $CLIENT_CONFIG"

          echo ""
          echo "OpenVPN service:"
          sudo systemctl is-active openvpn-server@server.service

          echo ""
          echo "OpenVPN configuration summary:"
          sudo grep -E '^(local|port|proto|dev) ' /etc/openvpn/server/server.conf

          # Execute the requested menu path: 4 = View and download clients,
          # select client 1, then 3 = back to config list, 0 = back to main menu,
          # 5 = exit. We deliberately do NOT print config contents to the log.
          sudo expect <<'EXPECT_MENU'
          set timeout 30
          log_user 1

          spawn /tmp/openvpn-install/openvpn-install.sh
          expect -re {Option:} { send "4\r" }
          expect -re {Configuration:} { send "1\r" }
          expect -re {Option:} { send "3\r" }
          expect -re {Configuration:} { send "0\r" }
          expect eof
          EXPECT_MENU

          # Final existence check after the menu.
          test -s "$CLIENT_CONFIG"
          echo "OpenVPN client artifact is ready: $CLIENT_CONFIG"

      # =========================================================
      # 9. Deliver OpenVPN client config as GitHub Artifact
      # =========================================================
      - name: 9. Upload OpenVPN client config
        uses: actions/upload-artifact@v7
        with:
          name: openvpn-client-github-vps
          path: /tmp/openvpn-install/github-vps.ovpn
          if-no-files-found: error
          retention-days: 1

      # =========================================================
      # 10. Install PostgreSQL
      # =========================================================
      - name: 10. Install PostgreSQL
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            postgresql \
            postgresql-client

          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          sleep 3

          sudo systemctl is-active postgresql

          echo ""
          echo "PostgreSQL version:"
          sudo -u postgres psql -c "SELECT version();"

      # =========================================================
      # 11. Create PostgreSQL Odoo role
      # =========================================================
      - name: 11. Create PostgreSQL Odoo role
        run: |
          set -e

          if sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin'" \
            | grep -q 1
          then
            echo "Role odooadmin already exists."

            sudo -u postgres psql -c \
              "ALTER ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"
          else
            echo "Creating role odooadmin..."

            sudo -u postgres psql -c \
              "CREATE ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"
          fi

          echo ""
          echo "PostgreSQL roles:"

          sudo -u postgres psql -c "\du"

      # =========================================================
      # 12. Install Odoo 19 dependencies
      # =========================================================
      - name: 12. Install Odoo 19 dependencies
        run: |
          set -e

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            python3 \
            python3-dev \
            python3-venv \
            python3-pip \
            build-essential \
            libxml2-dev \
            libxslt1-dev \
            libldap2-dev \
            libsasl2-dev \
            libssl-dev \
            libjpeg-dev \
            libpq-dev \
            libffi-dev \
            libxmlsec1-dev \
            libxmlsec1-openssl \
            libtiff-dev \
            libopenjp2-7-dev \
            zlib1g-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev \
            npm \
            node-less \
            node-clean-css \
            wkhtmltopdf

      # =========================================================
      # 13. Create Odoo user and directories
      # =========================================================
      - name: 13. Create Odoo system user
        run: |
          set -e

          if id odoo >/dev/null 2>&1; then
            echo "Odoo user already exists."
          else
            sudo useradd \
              --system \
              --home=/opt/odoo \
              --shell=/bin/bash \
              odoo
          fi

          sudo mkdir -p /opt/odoo
          sudo mkdir -p /opt/odoo/custom-addons
          sudo mkdir -p /opt/odoo/.local/share/Odoo/filestore

          sudo chown -R odoo:odoo /opt/odoo

      # =========================================================
      # 14. Install Odoo 19
      # =========================================================
      - name: 14. Install Odoo 19
        run: |
          set -e

          if [ -d /opt/odoo/odoo/.git ]; then
            echo "Odoo repository already exists."

            sudo -u odoo git \
              -C /opt/odoo/odoo \
              fetch --depth 1 origin 19.0

            sudo -u odoo git \
              -C /opt/odoo/odoo \
              checkout -B 19.0 origin/19.0
          else
            echo "Cloning Odoo 19..."

            sudo -u odoo git clone \
              --depth 1 \
              --branch 19.0 \
              https://github.com/odoo/odoo.git \
              /opt/odoo/odoo
          fi

          echo ""
          echo "Odoo source branch:"
          sudo -u odoo git \
            -C /opt/odoo/odoo \
            branch --show-current

          echo ""
          echo "Odoo commit:"
          sudo -u odoo git \
            -C /opt/odoo/odoo \
            rev-parse --short HEAD

      # =========================================================
      # 15. Create Python virtual environment
      # =========================================================
      - name: 15. Create Python virtual environment
        run: |
          set -e

          sudo -u odoo python3 -m venv /opt/odoo/venv

          sudo -u odoo \
            /opt/odoo/venv/bin/pip \
            install --upgrade pip setuptools wheel

      # =========================================================
      # 16. Install Python requirements
      # =========================================================
      - name: 16. Install Odoo Python requirements
        run: |
          set -e

          sudo -u odoo \
            /opt/odoo/venv/bin/pip \
            install \
            -r /opt/odoo/odoo/requirements.txt

      # =========================================================
      # 17. Verify Odoo 19 Python environment
      # =========================================================
      - name: 17. Verify Odoo 19
        run: |
          set -e

          echo "Checking lxml..."
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            -c "from lxml import etree; print('lxml OK:', etree.LXML_VERSION)"

          echo ""
          echo "Checking Odoo..."
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

      # =========================================================
      # 15. Configure Odoo
      # =========================================================
      - name: 18. Configure Odoo 19
        run: |
          set -e

          sudo mkdir -p /var/log/odoo
          sudo chown odoo:odoo /var/log/odoo

          sudo tee /etc/odoo.conf > /dev/null <<'EOF'
          [options]

          admin_passwd = vahid123

          db_host = 127.0.0.1
          db_port = 5432
          db_user = odooadmin
          db_password = odooadmin

          addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons

          data_dir = /opt/odoo/.local/share/Odoo

          logfile = /var/log/odoo/odoo.log

          http_port = 8069

          proxy_mode = False
          list_db = True
          EOF

          sudo chown root:odoo /etc/odoo.conf
          sudo chmod 640 /etc/odoo.conf

          echo ""
          echo "Odoo configuration:"
          sudo grep -E \
            '^(admin_passwd|db_host|db_port|db_user|addons_path|data_dir|http_port)' \
            /etc/odoo.conf

      # =========================================================
      # 16. Configure PostgreSQL role
      # =========================================================
      - name: 19. Configure PostgreSQL for Odoo
        run: |
          set -e

          echo "Checking PostgreSQL..."
          sudo systemctl enable postgresql
          sudo systemctl start postgresql

          echo ""
          echo "Creating PostgreSQL role odooadmin..."

          sudo -u postgres psql -tc \
            "SELECT 1 FROM pg_roles WHERE rolname='odooadmin';" \
            | grep -q 1 || \
          sudo -u postgres psql -c \
            "CREATE ROLE odooadmin WITH LOGIN CREATEDB PASSWORD 'odooadmin';"

          echo ""
          echo "PostgreSQL roles:"
          sudo -u postgres psql -c "\du"


      # =========================================================
      # 16. Create Odoo systemd service
      # =========================================================
      - name: 20. Create Odoo service
        run: |
          set -e

          sudo tee /etc/systemd/system/odoo.service > /dev/null <<'EOF'
          [Unit]
          Description=Odoo 19
          Documentation=https://www.odoo.com
          After=network.target postgresql.service
          Requires=postgresql.service

          [Service]
          Type=simple

          User=odoo
          Group=odoo

          ExecStart=/opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin -c /etc/odoo.conf

          Restart=on-failure
          RestartSec=5

          KillMode=mixed
          TimeoutStopSec=30

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload

          sudo systemctl enable odoo

      # =========================================================
      # 17. Configure Odoo
      # =========================================================
      - name: 21. Configure Odoo
        run: |
          set -e

          sudo mkdir -p /opt/odoo/.local/share/Odoo/filestore
          sudo mkdir -p /var/log/odoo

          sudo chown -R odoo:odoo /opt/odoo/.local
          sudo chown -R odoo:odoo /var/log/odoo

          sudo tee /etc/odoo.conf > /dev/null <<'EOF'
          [options]
          admin_passwd = vahid123
          db_host = False
          db_port = False
          db_user = odooadmin
          db_password = odooadmin
          addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom-addons
          data_dir = /opt/odoo/.local/share/Odoo
          logfile = /var/log/odoo/odoo.log
          http_port = 8069
          proxy_mode = False
          workers = 0
          EOF

          sudo chown odoo:odoo /etc/odoo.conf
          sudo chmod 640 /etc/odoo.conf

      # =========================================================
      # 17. Start Odoo 19
      # =========================================================
      - name: 22. Start Odoo 19
        run: |
          set -e

          sudo systemctl start odoo

          echo "Waiting for Odoo..."

          sleep 10

          echo ""
          echo "Odoo service:"
          sudo systemctl is-active odoo

          echo ""
          echo "Odoo status:"
          sudo systemctl --no-pager --full status odoo | head -50

      # =========================================================
      # 18. Create Odoo 19 systemd service
      # =========================================================
      - name: 23. Create Odoo service
        run: |
          set -e

          sudo tee /etc/systemd/system/odoo.service > /dev/null <<'EOF'
          [Unit]
          Description=Odoo 19
          Requires=postgresql.service
          After=network.target postgresql.service

          [Service]
          Type=simple
          User=odoo
          Group=odoo
          WorkingDirectory=/opt/odoo/odoo
          ExecStart=/opt/odoo/venv/bin/python /opt/odoo/odoo/odoo-bin -c /etc/odoo.conf
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          sudo systemctl daemon-reload
          sudo systemctl enable odoo
          sudo systemctl start odoo

      # =========================================================
      # 18. Verify Odoo 19
      # =========================================================
      - name: 24. Verify Odoo 19
        run: |
          set -e

          echo "======================================"
          echo "Checking Odoo 19"
          echo "======================================"

          echo ""
          echo "Odoo version:"

          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "PostgreSQL roles:"

          sudo -u postgres psql -c "\du"

          echo ""
          echo "Odoo port:"

          sudo ss -lntp | grep ':8069'

          echo ""
          echo "HTTP test:"

          curl -I \
            --max-time 10 \
            http://127.0.0.1:8069

          echo ""
          echo "======================================"
          echo "ODOO 19 IS READY"
          echo "======================================"

      # =========================================================
      # 19. Verify Odoo service
      # =========================================================
      - name: 25. Verify Odoo service
        run: |
          set -e

          sleep 10

          echo "=== Odoo service ==="
          sudo systemctl is-active odoo

          echo ""
          echo "=== Odoo version ==="
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "=== Odoo port ==="
          sudo ss -lntp | grep ':8069'

          echo ""
          echo "=== HTTP test ==="
          curl -I http://127.0.0.1:8069/web/database/selector

          echo ""
          echo "======================================"
          echo "ODOO 19 LAB READY"
          echo "======================================"

      # =========================================================
      # 19. Show connection information
      # =========================================================
      - name: 26. Connection Information
        run: |
          echo ""
          echo "======================================================"
          echo "             LINUX ODOO 19 LAB READY"
          echo "======================================================"

          echo ""
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

          echo ""
          echo "RDP USER:"
          echo "odooadmin"

          echo ""
          echo "RDP PASSWORD:"
          echo "OdooLab@2026!"

          echo ""
          echo "RDP PORT:"
          echo "3389"

          echo ""
          echo "ODOO:"
          echo "http://<TAILSCALE-IP>:8069"

          echo ""
          echo "ODOO VERSION:"
          sudo -u odoo \
            /opt/odoo/venv/bin/python \
            /opt/odoo/odoo/odoo-bin \
            --version

          echo ""
          echo "======================================================"

          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo ""
          echo "TAILSCALE:"
          sudo tailscale status

          echo ""
          echo "POSTGRESQL:"
          sudo systemctl is-active postgresql

          echo ""
          echo "ODOO:"
          sudo systemctl is-active odoo

      # =========================================================
      # 20. Configure GitHub Self-hosted Runner
      # =========================================================
      - name: 27. Configure GitHub Self-hosted Runner
        env:
          GH_TOKEN: ${{ secrets.RUNNER_MANAGER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "======================================"
          echo "Configuring GitHub Self-hosted Runner"
          echo "======================================"

          RUNNER_DIR="/home/odooadmin/actions-runner"
          RUNNER_NAME="github-linux-odoo"

          echo ""
          echo "Repository:"
          echo "$REPO"

          echo ""
          echo "Runner directory:"
          echo "$RUNNER_DIR"

          # --------------------------------------------------
          # 20.1 Install GitHub CLI
          # --------------------------------------------------
          if ! command -v gh >/dev/null 2>&1; then
            echo "Installing GitHub CLI..."

            sudo apt-get update
            sudo apt-get install -y gh
          fi

          echo ""
          echo "GitHub CLI:"
          gh --version

          # --------------------------------------------------
          # 20.2 Get fresh runner registration token
          # --------------------------------------------------
          echo ""
          echo "Requesting fresh GitHub runner registration token..."

          REG_TOKEN=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/actions/runners/registration-token" \
            --jq '.token')

          if [ -z "$REG_TOKEN" ]; then
            echo "ERROR: Failed to obtain runner registration token."
            exit 1
          fi

          echo "Fresh registration token obtained."

          # --------------------------------------------------
          # 20.3 Prepare runner directory
          # --------------------------------------------------
          echo ""
          echo "Preparing runner directory..."

          sudo rm -rf "$RUNNER_DIR"
          sudo mkdir -p "$RUNNER_DIR"

          sudo chown -R odooadmin:odooadmin \
            /home/odooadmin

          # --------------------------------------------------
          # 20.4 Download latest GitHub Actions runner
          # --------------------------------------------------
          echo ""
          echo "Downloading latest GitHub Actions runner..."

          sudo -u odooadmin \
            bash -c "cd '$RUNNER_DIR' && \
            RUNNER_VERSION=\$(curl -fsSL \
              https://api.github.com/repos/actions/runner/releases/latest \
              | grep '\"tag_name\":' \
              | head -1 \
              | cut -d '\"' -f4) && \
            echo \"Runner version: \$RUNNER_VERSION\" && \
            RUNNER_VERSION_NUMBER=\"\${RUNNER_VERSION#v}\" && \
            curl -fL \
              -o actions-runner.tar.gz \
              \"https://github.com/actions/runner/releases/download/\${RUNNER_VERSION}/actions-runner-linux-x64-\${RUNNER_VERSION_NUMBER}.tar.gz\""

          # --------------------------------------------------
          # 20.5 Extract runner
          # --------------------------------------------------
          echo ""
          echo "Extracting GitHub Actions runner..."

          sudo -u odooadmin \
            tar -xzf \
            "$RUNNER_DIR/actions-runner.tar.gz" \
            -C "$RUNNER_DIR"

          sudo rm -f \
            "$RUNNER_DIR/actions-runner.tar.gz"

          # --------------------------------------------------
          # 20.6 Install runner dependencies
          # --------------------------------------------------
          echo ""
          echo "Installing runner dependencies..."

          cd "$RUNNER_DIR"

          sudo ./bin/installdependencies.sh

          # --------------------------------------------------
          # 20.7 Configure runner
          # --------------------------------------------------
          echo ""
          echo "Registering runner with GitHub..."

          sudo -u odooadmin \
            ./config.sh \
              --unattended \
              --url "https://github.com/${REPO}" \
              --token "$REG_TOKEN" \
              --name "$RUNNER_NAME" \
              --labels "self-hosted,linux,odoo" \
              --work "_work" \
              --replace

          # --------------------------------------------------
          # 20.8 Install systemd service
          # --------------------------------------------------
          echo ""
          echo "Installing GitHub Actions runner service..."

          sudo ./svc.sh install odooadmin

          sudo ./svc.sh start

          # --------------------------------------------------
          # 20.9 Verify service
          # --------------------------------------------------
          echo ""
          echo "Runner service status:"

          sudo ./svc.sh status

          echo ""
          echo "======================================"
          echo "GitHub Self-hosted Runner READY"
          echo "======================================"

          echo ""
          echo "Runner name:"
          echo "$RUNNER_NAME"

          echo ""
          echo "Labels:"
          echo "self-hosted, linux, odoo"

          echo ""
          echo "Repository:"
          echo "$REPO"

      # =========================================================
      # 20. Keep Runner Alive
      # =========================================================
      - name: 28. Keep Server Alive
        run: |
          for i in {1..360}; do
            echo "[$i/360] Linux Odoo 19 Lab is running..."
            sleep 60
          done
